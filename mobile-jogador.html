<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F0D24">
    <meta name="description" content="Entre no Quiz dos Veloso pelo celular.">
    <title>QUIZ DOS VELOSO - Jogar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jogador.css">
</head>
<body>
    <div class="bg-animation" aria-hidden="true"></div>
    <div class="container">
        <div class="status-banner" id="statusBanner" role="status"></div>
        <button type="button" class="btn-ensaio" id="btnEnsaio">Modo ensaio neste computador</button>

        <section class="screen active" id="registerScreen" aria-hidden="false">
            <h1 class="logo">⭐ QUIZ DOS VELOSO ⭐</h1>
            <div class="card">
                <h2 class="card-title">👋 Entrar no quiz</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="playerName">Seu nome</label>
                        <input type="text" class="form-input" id="playerName" name="nickname" placeholder="Digite seu nome..." required maxlength="30" autocomplete="nickname" enterkeyhint="done">
                    </div>
                    <div class="form-group photo-section">
                        <span class="form-label" id="photoLabel">Sua foto (opcional)</span>
                        <div class="photo-preview-container">
                            <img class="photo-preview" id="photoPreview" alt="Prévia da sua foto">
                            <span class="photo-placeholder" id="photoPlaceholder" aria-hidden="true">📷</span>
                        </div>
                        <div class="photo-buttons">
                            <button type="button" class="btn-photo btn-camera" id="btnCamera">📸 Câmera</button>
                            <button type="button" class="btn-photo btn-gallery" id="btnGallery">🖼️ Galeria</button>
                        </div>
                        <input type="file" id="cameraInput" accept="image/*" capture="user" hidden aria-labelledby="photoLabel">
                        <input type="file" id="galleryInput" accept="image/*" hidden aria-labelledby="photoLabel">
                    </div>
                    <p class="form-error" id="joinError" role="alert"></p>
                    <button type="submit" class="btn-primary" id="btnJoin">🎮 Entrar no jogo</button>
                </form>
            </div>
        </section>

        <section class="screen" id="waitingScreen" aria-hidden="true">
            <div class="waiting-screen">
                <img class="waiting-avatar" id="waitingAvatar" alt="">
                <h2 class="waiting-name" id="waitingName">Jogador</h2>
                <p class="waiting-text">Aguardando o jogo começar...<br>Deixe esta página aberta.</p>
                <div class="waiting-dots" aria-hidden="true"><div class="waiting-dot"></div><div class="waiting-dot"></div><div class="waiting-dot"></div></div>
                <div class="player-counter">
                    <div class="player-counter-number" id="waitingPlayerCount" aria-live="polite">0</div>
                    <div class="player-counter-label">jogadores conectados</div>
                </div>
                <button type="button" class="btn-leave" id="btnLeave">Não sou eu / sair</button>
            </div>
        </section>

        <section class="screen" id="gameScreen" aria-hidden="true">
            <div class="question-header">
                <span class="question-counter" id="gameQuestionCounter">Pergunta 1/10</span>
                <span class="question-score" id="gameScore">⭐ 0 acertos</span>
            </div>
            <div class="progress-bar-container" aria-hidden="true"><div class="progress-bar" id="gameProgressBar"></div></div>
            <div class="timer-display" id="timerDisplay" aria-live="polite">
                <div class="timer-bar-container"><div class="timer-bar" id="timerBar"></div></div>
                <div class="timer-text" id="timerText">⏱️ 10</div>
            </div>
            <div class="question-card">
                <img class="question-image" id="gameQuestionImage" alt="">
                <p class="question-text" id="gameQuestionText">Carregando pergunta...</p>
            </div>
            <div class="options-grid" id="optionsGrid"></div>
            <div id="feedbackArea" aria-live="polite"></div>
        </section>

        <section class="screen" id="resultsScreen" aria-hidden="true">
            <div class="results-screen">
                <div class="results-badge participant" id="resultsBadge">⭐</div>
                <h2 class="results-position" id="resultsPosition">Resultado</h2>
                <p class="results-message" id="resultsMessage"></p>
                <div class="results-stats">
                    <div class="stat-item"><div class="stat-value" id="resultsScore">0</div><div class="stat-label">acertos</div></div>
                    <div class="stat-item"><div class="stat-value" id="resultsPercent">0%</div><div class="stat-label">aproveitamento</div></div>
                </div>
                <div class="mini-ranking" id="miniRanking"></div>
                <button type="button" class="btn-leave" id="btnLeaveResults">Sair do jogo</button>
            </div>
        </section>
    </div>
    <div class="animation-overlay" id="animationOverlay"><div id="animationContent"></div></div>
    <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>
    <script type="module" src="js/jogador.js"></script>
</body>
</html>
